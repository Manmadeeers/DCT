name: warehouse

x-postgres: &postgres
  image: warehouse-patroni:18.6

  build:
    context: ./database/ha
    dockerfile: Dockerfile

  depends_on:
    etcd:
      condition: service_healthy

  healthcheck:
    test:
      - CMD-SHELL
      - pg_isready -U dct_user -d postgres
    interval: 5s
    timeout: 3s
    retries: 24
    start_period: 10s

  stop_grace_period: 60s
  restart: "no"

x-subscriber-environment: &subscriber-environment
  DOTNET_ENVIRONMENT: Production
  Broker__Endpoints__0: http://message-broker:8080/
  Broker__Endpoints__1: http://message-broker-2:8080/

x-consensus-environment: &consensus-environment
  ASPNETCORE_ENVIRONMENT: Production
  ASPNETCORE_URLS: http://+:8080
  Cluster__HeartbeatIntervalMilliseconds: "1000"
  Cluster__HeartbeatTimeoutMilliseconds: "750"
  Cluster__Nodes__0__Id: "1"
  Cluster__Nodes__0__BaseUrl: http://consensus-node-1:8080
  Cluster__Nodes__1__Id: "2"
  Cluster__Nodes__1__BaseUrl: http://consensus-node-2:8080
  Cluster__Nodes__2__Id: "3"
  Cluster__Nodes__2__BaseUrl: http://consensus-node-3:8080
  Cluster__Nodes__3__Id: "4"
  Cluster__Nodes__3__BaseUrl: http://consensus-node-4:8080
  Cluster__Nodes__4__Id: "5"
  Cluster__Nodes__4__BaseUrl: http://consensus-node-5:8080

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: warehouse-etcd

    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=warehouse-patroni

    volumes:
      - etcd_data:/etcd-data

    healthcheck:
      test:
        - CMD
        - /usr/local/bin/etcdctl
        - --endpoints=http://127.0.0.1:2379
        - endpoint
        - health
      interval: 5s
      timeout: 3s
      retries: 12

    restart: unless-stopped

  postgres:
    <<: *postgres
    container_name: dct

    environment:
      PATRONI_NAME: dct
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgres:5432

    ports:
      - "5432:5432"
      - "127.0.0.1:8008:8008"

    volumes:
      - patroni_primary_data:/var/lib/postgresql
      - ./database/ha/patroni.yml:/etc/patroni.yml:ro

  postgres-replica:
    <<: *postgres
    container_name: dct-replica

    environment:
      PATRONI_NAME: dct-replica
      PATRONI_RESTAPI_CONNECT_ADDRESS: postgres-replica:8008
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgres-replica:5432

    ports:
      - "5433:5432"
      - "127.0.0.1:8009:8008"

    volumes:
      - patroni_replica_data:/var/lib/postgresql
      - ./database/ha/patroni.yml:/etc/patroni.yml:ro

  message-broker:
    container_name: warehouse-message-broker
    image: warehouse-message-broker:latest
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile.broker

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__Broker: >-
        Host=postgres:5432,postgres-replica:5432;Database=postgres;Username=dct_user;Password=dct_password;Target Session Attributes=read-write;Timeout=3;Command Timeout=15;Host Recheck Seconds=2

    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy

    ports:
      - "127.0.0.1:5080:8080"

    stop_grace_period: 20s

  message-broker-2:
    container_name: warehouse-message-broker-2
    image: warehouse-message-broker:latest
    restart: unless-stopped

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

      ConnectionStrings__Broker: >-
        Host=postgres:5432,postgres-replica:5432;Database=postgres;Username=dct_user;Password=dct_password;Target Session Attributes=read-write;Timeout=3;Command Timeout=15;Host Recheck Seconds=2

    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy

    ports:
      - "127.0.0.1:5081:8080"

    stop_grace_period: 20s

  audit-subscriber:
    container_name: warehouse-audit-subscriber
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile.pubsub
      args:
        SUBSCRIBER_PROJECT: services/Warehouse.AuditSubscriber/Warehouse.AuditSubscriber.csproj

    command:
      - Warehouse.AuditSubscriber.dll

    environment:
      <<: *subscriber-environment

    depends_on:
      message-broker:
        condition: service_started
      message-broker-2:
        condition: service_started

    stop_grace_period: 20s

  notification-subscriber:
    container_name: warehouse-notification-subscriber
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile.pubsub
      args:
        SUBSCRIBER_PROJECT: services/Warehouse.NotificationSubscriber/Warehouse.NotificationSubscriber.csproj

    command:
      - Warehouse.NotificationSubscriber.dll

    environment:
      <<: *subscriber-environment
      Notifications__LowStockThreshold: "5"

    depends_on:
      message-broker:
        condition: service_started
      message-broker-2:
        condition: service_started

    stop_grace_period: 20s

  catalog-subscriber:
    container_name: warehouse-catalog-subscriber
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile.pubsub
      args:
        SUBSCRIBER_PROJECT: services/Warehouse.CatalogSubscriber/Warehouse.CatalogSubscriber.csproj

    command:
      - Warehouse.CatalogSubscriber.dll

    environment:
      <<: *subscriber-environment

    depends_on:
      message-broker:
        condition: service_started
      message-broker-2:
        condition: service_started

    stop_grace_period: 20s

  eventanalytics-subscriber:
    container_name: warehouse-eventanalytics-subscriber
    restart: unless-stopped

    build:
      context: .
      dockerfile: Dockerfile.pubsub
      args:
        SUBSCRIBER_PROJECT: services/Warehouse.EventAnalyticsSubscriber/Warehouse.EventAnalyticsSubscriber.csproj

    command:
      - Warehouse.EventAnalyticsSubscriber.dll

    environment:
      <<: *subscriber-environment
      Analytics__StateFile: /data/statistics.json

    volumes:
      - warehouse_analytics_data:/data

    depends_on:
      message-broker:
        condition: service_started
      message-broker-2:
        condition: service_started

    stop_grace_period: 20s

  consensus-node-1:
    container_name: warehouse-consensus-node-1
    image: warehouse-consensus-node:latest
    build:
      context: .
      dockerfile: Dockerfile.consensus-node
    environment:
      <<: *consensus-environment
      Cluster__NodeId: "1"
    ports:
      - "127.0.0.1:5101:8080"
    restart: unless-stopped

  consensus-node-2:
    container_name: warehouse-consensus-node-2
    image: warehouse-consensus-node:latest
    build:
      context: .
      dockerfile: Dockerfile.consensus-node
    environment:
      <<: *consensus-environment
      Cluster__NodeId: "2"
    ports:
      - "127.0.0.1:5102:8080"
    restart: unless-stopped

  consensus-node-3:
    container_name: warehouse-consensus-node-3
    image: warehouse-consensus-node:latest
    build:
      context: .
      dockerfile: Dockerfile.consensus-node
    environment:
      <<: *consensus-environment
      Cluster__NodeId: "3"
    ports:
      - "127.0.0.1:5103:8080"
    restart: unless-stopped

  consensus-node-4:
    container_name: warehouse-consensus-node-4
    image: warehouse-consensus-node:latest
    build:
      context: .
      dockerfile: Dockerfile.consensus-node
    environment:
      <<: *consensus-environment
      Cluster__NodeId: "4"
    ports:
      - "127.0.0.1:5104:8080"
    restart: unless-stopped

  consensus-node-5:
    container_name: warehouse-consensus-node-5
    image: warehouse-consensus-node:latest
    build:
      context: .
      dockerfile: Dockerfile.consensus-node
    environment:
      <<: *consensus-environment
      Cluster__NodeId: "5"
    ports:
      - "127.0.0.1:5105:8080"
    restart: unless-stopped

  api:
    container_name: warehouse-api
    image: warehouse-api:latest
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: >-
        Host=postgres:5432,postgres-replica:5432;Database=warehouse_db;Username=dct_user;Password=dct_password;Timeout=3;Command Timeout=30;Host Recheck Seconds=2;Load Balance Hosts=false
      ConnectionStrings__PrimaryNode: >-
        Host=postgres;Port=5432;Database=warehouse_db;Username=dct_user;Password=dct_password
      ConnectionStrings__ReplicaNode: >-
        Host=postgres-replica;Port=5432;Database=warehouse_db;Username=dct_user;Password=dct_password
      Broker__BaseUrl: http://message-broker:8080/
      Broker__Endpoints__0: http://message-broker:8080/
      Broker__Endpoints__1: http://message-broker-2:8080/
      Consensus__Nodes__0__Id: "1"
      Consensus__Nodes__0__BaseUrl: http://consensus-node-1:8080
      Consensus__Nodes__1__Id: "2"
      Consensus__Nodes__1__BaseUrl: http://consensus-node-2:8080
      Consensus__Nodes__2__Id: "3"
      Consensus__Nodes__2__BaseUrl: http://consensus-node-3:8080
      Consensus__Nodes__3__Id: "4"
      Consensus__Nodes__3__BaseUrl: http://consensus-node-4:8080
      Consensus__Nodes__4__Id: "5"
      Consensus__Nodes__4__BaseUrl: http://consensus-node-5:8080
    depends_on:
      postgres:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy
      message-broker:
        condition: service_started
      message-broker-2:
        condition: service_started
      consensus-node-1:
        condition: service_started
      consensus-node-2:
        condition: service_started
      consensus-node-3:
        condition: service_started
      consensus-node-4:
        condition: service_started
      consensus-node-5:
        condition: service_started
    ports:
      - "5000:8080"
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  etcd_data:
    name: warehouse_patroni_etcd

  patroni_primary_data:
    name: warehouse_patroni_primary_pg18

  patroni_replica_data:
    name: warehouse_patroni_replica_pg18

  warehouse_analytics_data:
    name: warehouse_analytics_data
