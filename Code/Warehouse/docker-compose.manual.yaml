name: warehouse

x-database: &database
  image: postgres:18.6
  environment:
    POSTGRES_USER: dct_user
    POSTGRES_PASSWORD: dct_password
    POSTGRES_DB: warehouse_db
    PGDATA: /var/lib/postgresql/18/docker
  entrypoint:
    - bash
    - /scripts/start-existing.sh
  command:
    - postgres
    - -c
    - listen_addresses=*
    - -c
    - wal_level=replica
    - -c
    - max_wal_senders=10
    - -c
    - max_replication_slots=10
    - -c
    - max_slot_wal_keep_size=1GB
    - -c
    - hot_standby=on
    - -c
    - synchronous_commit=remote_apply
  healthcheck:
    test:
      - CMD-SHELL
      - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s
  stop_grace_period: 60s
  restart: "no"

x-clone: &clone
  image: postgres:18.6
  entrypoint:
    - bash
    - /scripts/clone.sh
  profiles:
    - tools
  restart: "no"

services:
  postgres:
    <<: *database
    container_name: dct
    ports:
      - "5432:5432"
    volumes:
      - primary_data:/var/lib/postgresql
      - ./database/replication/start-existing.sh:/scripts/start-existing.sh:ro

  postgres-replica:
    <<: *database
    container_name: dct-replica
    ports:
      - "5433:5432"
    volumes:
      - replica_data:/var/lib/postgresql
      - ./database/replication/start-existing.sh:/scripts/start-existing.sh:ro

  clone-replica:
    <<: *clone
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      UPSTREAM_HOST: postgres
      NODE_NAME: dct-replica
      SLOT_NAME: warehouse_replica
      REPLICATION_PASSWORD: replication_password
    volumes:
      - replica_data:/var/lib/postgresql
      - ./database/replication/clone.sh:/scripts/clone.sh:ro

  clone-primary:
    <<: *clone
    environment:
      PGDATA: /var/lib/postgresql/18/docker
      UPSTREAM_HOST: postgres-replica
      NODE_NAME: dct
      SLOT_NAME: warehouse_primary
      REPLICATION_PASSWORD: replication_password
    volumes:
      - primary_data:/var/lib/postgresql
      - ./database/replication/clone.sh:/scripts/clone.sh:ro

volumes:
  primary_data:
    external: true
    name: "70d7119279ae698d7134875a9b75c92e7ed27251ae7c1eadc0814c16f5253f00"

  replica_data:
    name: warehouse_replica_pg18